<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -30 80 60" width="80" height="60">
  <!-- paper-coloured backing so the frame lines break around the ornament -->
  <rect x="-34" y="-6" width="68" height="12" fill="#fcecd6"/>
  <g fill="#d27a43">
    <!-- four three-lobed motifs pointing out to the diamond's corners -->
    <g id="m">
      <path d="M0,-27 C3,-23 5,-20 3,-16 C6,-17 8,-14 6,-11 C4,-9 2,-10 0,-8 C-2,-10 -4,-9 -6,-11 C-8,-14 -6,-17 -3,-16 C-5,-20 -3,-23 0,-27Z"/>
      <circle cx="0" cy="-12.5" r="1.3" fill="#fcecd6"/>
    </g>
    <use href="#m" transform="rotate(90)"/>
    <use href="#m" transform="rotate(180)"/>
    <use href="#m" transform="rotate(270)"/>
    <!-- small petals on the diagonals -->
    <g transform="rotate(45)">
      <ellipse cx="0" cy="-10" rx="2.2" ry="4"/><ellipse cx="0" cy="10" rx="2.2" ry="4"/>
      <ellipse cx="-10" cy="0" rx="4" ry="2.2"/><ellipse cx="10" cy="0" rx="4" ry="2.2"/>
    </g>
    <!-- centre flower -->
    <g>
      <ellipse cx="0" cy="-4" rx="2" ry="3.4"/><ellipse cx="0" cy="4" rx="2" ry="3.4"/>
      <ellipse cx="-4" cy="0" rx="3.4" ry="2"/><ellipse cx="4" cy="0" rx="3.4" ry="2"/>
      <g transform="rotate(45)"><ellipse cx="0" cy="-4" rx="1.6" ry="2.8"/><ellipse cx="0" cy="4" rx="1.6" ry="2.8"/><ellipse cx="-4" cy="0" rx="2.8" ry="1.6"/><ellipse cx="4" cy="0" rx="2.8" ry="1.6"/></g>
    </g>
  </g>
  <circle r="2" fill="#fcecd6"/>
  <circle r="1" fill="#d27a43"/>
  <!-- dotted diamond outline -->
  <path d="M0,-29 L29,0 L0,29 L-29,0Z" fill="none" stroke="#d27a43" stroke-width=".8" stroke-dasharray="1 2.4" stroke-linecap="round" opacity=".7"/>
</svg>
